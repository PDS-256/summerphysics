<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1D Motion Explorer</title>
  <style>
    /* --- Base / Reset --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1e2e;
      --surface:   #232840;
      --border:    #323755;
      --text:      #e8eaf0;
      --text-dim:  #8a90a8;
      --color-x:   #5b9cf6;
      --color-v:   #4ec994;
      --color-a:   #f4874b;
      --radius:    10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
      gap: 20px;
    }

    /* --- Title --- */
    h1 {
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    h1 span { color: var(--color-x); }

    /* --- Cards --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      width: 100%;
      max-width: 720px;
    }

    /* --- Canvas --- */
    #simCanvas {
      display: block;
      width: 100%;
      border-radius: 6px;
      background: #111520;
      cursor: default;
    }

    /* --- Off-frame note --- */
    #offFrameNote {
      text-align: center;
      margin-top: 8px;
      font-size: 0.82rem;
      font-style: italic;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.4s;
      min-height: 1.2em;
    }
    #offFrameNote.visible { opacity: 1; }

    /* --- Readout panel --- */
    .readout {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 14px;
    }
    .readout-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .readout-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }
    .readout-value {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      text-align: center;
    }
    .readout-item.x .readout-value { color: var(--color-x); }
    .readout-item.v .readout-value { color: var(--color-v); }
    .readout-item.a .readout-value { color: var(--color-a); }

    /* --- Slider panel --- */
    .sliders {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }
    .slider-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      align-items: center;
      gap: 12px;
    }
    .slider-label {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-align: right;
    }
    .slider-label em {
      font-style: italic;
      font-weight: 700;
      font-size: 1rem;
    }
    .slider-label em.x { color: var(--color-x); }
    .slider-label em.v { color: var(--color-v); }
    .slider-label em.a { color: var(--color-a); }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      background: var(--border);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      cursor: pointer;
    }
    #sliderX::-webkit-slider-thumb { background: var(--color-x); }
    #sliderV::-webkit-slider-thumb { background: var(--color-v); }
    #sliderA::-webkit-slider-thumb { background: var(--color-a); }
    #sliderX::-moz-range-thumb { background: var(--color-x); width:14px; height:14px; border-radius:50%; border:2px solid var(--surface); cursor:pointer; }
    #sliderV::-moz-range-thumb { background: var(--color-v); width:14px; height:14px; border-radius:50%; border:2px solid var(--surface); cursor:pointer; }
    #sliderA::-moz-range-thumb { background: var(--color-a); width:14px; height:14px; border-radius:50%; border:2px solid var(--surface); cursor:pointer; }

    .slider-val {
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }
    .slider-val.x { color: var(--color-x); }
    .slider-val.v { color: var(--color-v); }
    .slider-val.a { color: var(--color-a); }

    /* --- Controls --- */
    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 4px;
    }
    button {
      padding: 9px 32px;
      border-radius: 7px;
      border: 1.5px solid;
      font-size: 0.93rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    #btnStartPause {
      background: var(--color-v);
      border-color: var(--color-v);
      color: #111520;
    }
    #btnStartPause:hover { background: #3db87e; }

    #btnReset {
      background: transparent;
      border-color: var(--border);
      color: var(--text-dim);
    }
    #btnReset:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }

    /* --- Reset button pulse after boundary --- */
    @keyframes resetPulse {
      0%   { box-shadow: 0 0 0 0 rgba(91, 156, 246, 0.55); border-color: var(--color-x); color: var(--color-x); }
      60%  { box-shadow: 0 0 0 7px rgba(91, 156, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(91, 156, 246, 0); border-color: var(--color-x); color: var(--color-x); }
    }
    #btnReset.pulsing {
      animation: resetPulse 1.4s ease-out infinite;
      border-color: var(--color-x);
      color: var(--color-x);
    }
  </style>
</head>
<body>

  <h1>1D Motion <span>Explorer</span></h1>

  <!-- Simulation canvas -->
  <div class="card">
    <canvas id="simCanvas" width="672" height="200"></canvas>
    <div id="offFrameNote">The object has left the frame.</div>

    <!-- Numerical readout -->
    <div class="readout">
      <div class="readout-item x">
        <span class="readout-label">Position</span>
        <span class="readout-value" id="readX">+0.00 m</span>
      </div>
      <div class="readout-item v">
        <span class="readout-label">Velocity</span>
        <span class="readout-value" id="readV">+0.00 m/s</span>
      </div>
      <div class="readout-item a">
        <span class="readout-label">Acceleration</span>
        <span class="readout-value" id="readA">+0.0 m/s²</span>
      </div>
    </div>
  </div>

  <!-- Sliders -->
  <div class="card sliders">
    <div class="slider-row">
      <span class="slider-label"><em class="x">x</em> (m)</span>
      <input type="range" id="sliderX" min="-10" max="10" step="0.5" value="0">
      <span class="slider-val x" id="valX">+0.0 m</span>
    </div>
    <div class="slider-row">
      <span class="slider-label"><em class="v">v</em> (m/s)</span>
      <input type="range" id="sliderV" min="-2" max="2" step="0.1" value="0">
      <span class="slider-val v" id="valV">+0.0 m/s</span>
    </div>
    <div class="slider-row">
      <span class="slider-label"><em class="a">a</em> (m/s²)</span>
      <input type="range" id="sliderA" min="-2" max="2" step="0.1" value="0">
      <span class="slider-val a" id="valA">+0.0 m/s²</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="card controls">
    <button id="btnStartPause">Start</button>
    <button id="btnReset">Reset</button>
  </div>

<script>
// =============================================================
// State
// =============================================================
let x = 0;   // position (m)
let v = 0;   // velocity (m/s)
let a = 0;   // acceleration (m/s²)

let running       = false;
let rafId         = null;
let lastTimestamp = null;
let isDragging    = false;

// =============================================================
// DOM refs
// =============================================================
const canvas        = document.getElementById('simCanvas');
const ctx           = canvas.getContext('2d');
const sliderX       = document.getElementById('sliderX');
const sliderV       = document.getElementById('sliderV');
const sliderA       = document.getElementById('sliderA');
const valX          = document.getElementById('valX');
const valV          = document.getElementById('valV');
const valA          = document.getElementById('valA');
const readX         = document.getElementById('readX');
const readV         = document.getElementById('readV');
const readA         = document.getElementById('readA');
const btnStartPause = document.getElementById('btnStartPause');
const btnReset      = document.getElementById('btnReset');
const offFrameNote  = document.getElementById('offFrameNote');

// =============================================================
// Canvas geometry
// =============================================================
const X_MIN = -10, X_MAX = 10;  // logical range (m)
const PAD   = 40;                // px margin each side

function mToPixel(meterVal) {
  return PAD + (meterVal - X_MIN) / (X_MAX - X_MIN) * (canvas.width - 2 * PAD);
}

function pixelToM(px) {
  return X_MIN + (px - PAD) / (canvas.width - 2 * PAD) * (X_MAX - X_MIN);
}

const FIGURE_Y  = 118;
const V_ARROW_Y = FIGURE_Y - 42;
const A_ARROW_Y = FIGURE_Y - 68;

// 2 m/s → ~1/4 of usable canvas width
function speedToPixels(speed) {
  return (Math.abs(speed) / 2) * ((canvas.width - 2 * PAD) / 4);
}

// =============================================================
// Colors
// =============================================================
const COLOR_V    = '#4ec994';
const COLOR_A    = '#f4874b';
const COLOR_DIM  = '#8a90a8';
const COLOR_BG   = '#111520';
const COLOR_LINE = '#2c3252';
const COLOR_ZERO = '#e8eaf0';

// =============================================================
// Render
// =============================================================
function render() {
  const cw = canvas.width;
  const ch = canvas.height;

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, cw, ch);

  // --- Number line ---
  const lineY = FIGURE_Y + 6;
  ctx.strokeStyle = COLOR_LINE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mToPixel(X_MIN), lineY);
  ctx.lineTo(mToPixel(X_MAX), lineY);
  ctx.stroke();

  ctx.textAlign    = 'center';
  ctx.textBaseline = 'top';
  for (let m = X_MIN; m <= X_MAX; m++) {
    const px      = mToPixel(m);
    const isMajor = (m % 5 === 0);
    const isZero  = (m === 0);

    ctx.strokeStyle = isZero ? COLOR_ZERO : (isMajor ? '#4a5275' : COLOR_LINE);
    ctx.lineWidth   = isZero ? 2.5 : (isMajor ? 1.5 : 1);
    const tickH     = isZero ? 12 : (isMajor ? 9 : 5);
    ctx.beginPath();
    ctx.moveTo(px, lineY - tickH);
    ctx.lineTo(px, lineY + tickH);
    ctx.stroke();

    if (isMajor || isZero) {
      ctx.fillStyle = isZero ? COLOR_ZERO : COLOR_DIM;
      ctx.font      = isZero ? 'bold 11px Segoe UI, system-ui, sans-serif'
                             : '10px Segoe UI, system-ui, sans-serif';
      ctx.fillText(String(m), px, lineY + tickH + 3);
    }
  }

  ctx.fillStyle = COLOR_DIM;
  ctx.font      = '10px Segoe UI, system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('m', mToPixel(X_MAX) + 4, lineY - 4);

  const figPx = mToPixel(x);

  // --- Velocity arrow ---
  if (Math.abs(v) > 0.001) {
    const dir = v > 0 ? 1 : -1;
    const ax1 = figPx + dir * speedToPixels(v);
    drawArrow(ctx, figPx, V_ARROW_Y, ax1, V_ARROW_Y, COLOR_V, 2.5);
    ctx.fillStyle    = COLOR_V;
    ctx.font         = 'italic bold 12px Segoe UI, system-ui, sans-serif';
    ctx.textAlign    = dir > 0 ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(`v = ${v >= 0 ? '+' : ''}${v.toFixed(1)}`, ax1 + dir * 6, V_ARROW_Y);
  }

  // --- Acceleration arrow (always visible when a ≠ 0) ---
  if (Math.abs(a) > 0.001) {
    const dir = a > 0 ? 1 : -1;
    const ax1 = figPx + dir * speedToPixels(a);
    drawArrow(ctx, figPx, A_ARROW_Y, ax1, A_ARROW_Y, COLOR_A, 2.5);
    ctx.fillStyle    = COLOR_A;
    ctx.font         = 'italic bold 12px Segoe UI, system-ui, sans-serif';
    ctx.textAlign    = dir > 0 ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(`a = ${a >= 0 ? '+' : ''}${a.toFixed(1)}`, ax1 + dir * 6, A_ARROW_Y);
  }

  // --- Stick figure (canvas clips it past the edges naturally) ---
  drawFigure(ctx, figPx, FIGURE_Y);
}

// =============================================================
// Arrow
// =============================================================
function drawArrow(ctx, x0, y0, x1, y1, color, lineWidth) {
  const headLen   = 9;
  const headAngle = Math.PI / 6;
  const angle     = Math.atan2(y1 - y0, x1 - x0);

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = lineWidth;
  ctx.lineCap     = 'round';

  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - headLen * Math.cos(angle - headAngle),
             y1 - headLen * Math.sin(angle - headAngle));
  ctx.lineTo(x1 - headLen * Math.cos(angle + headAngle),
             y1 - headLen * Math.sin(angle + headAngle));
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// =============================================================
// Stick figure
// =============================================================
function drawFigure(ctx, cx, baseY) {
  const headR     = 9;
  const torsoH    = 22;
  const legLen    = 18;
  const armLen    = 13;
  const headCY    = baseY - torsoH - legLen - headR - 2;
  const shoulderY = headCY + headR + 2;
  const hipY      = shoulderY + torsoH;
  const footY     = hipY + legLen;

  ctx.save();
  ctx.strokeStyle = '#d8dce8';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  ctx.beginPath();
  ctx.arc(cx, headCY, headR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, shoulderY);
  ctx.lineTo(cx, hipY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx - armLen, shoulderY + 8);
  ctx.lineTo(cx, shoulderY + 4);
  ctx.lineTo(cx + armLen, shoulderY + 8);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, hipY);
  ctx.lineTo(cx - 8, footY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, hipY);
  ctx.lineTo(cx + 8, footY);
  ctx.stroke();

  ctx.restore();
}

// =============================================================
// Readouts
// =============================================================
function fmt(val, decimals, unit) {
  return `${val >= 0 ? '+' : ''}${val.toFixed(decimals)} ${unit}`;
}

function updateReadouts() {
  readX.textContent = fmt(x, 2, 'm');
  readV.textContent = fmt(v, 2, 'm/s');
  readA.textContent = fmt(a, 1, 'm/s²');
  valX.textContent  = fmt(x, 1, 'm');
  valV.textContent  = fmt(v, 1, 'm/s');
  valA.textContent  = fmt(a, 1, 'm/s²');
  sliderX.value = x;
  sliderV.value = v;
  sliderA.value = a;
}

// =============================================================
// Boundary helpers
// =============================================================
function triggerBoundary() {
  pauseSimulation();
  offFrameNote.classList.add('visible');
  btnReset.classList.add('pulsing');
}

function clearBoundary() {
  offFrameNote.classList.remove('visible');
  btnReset.classList.remove('pulsing');
}

// =============================================================
// Physics loop
// =============================================================
function physicsStep(timestamp) {
  if (lastTimestamp === null) lastTimestamp = timestamp;
  const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
  lastTimestamp = timestamp;

  a  = parseFloat(sliderA.value);
  v += a * dt;
  v  = Math.max(-20, Math.min(20, v));
  x += v * dt;

  updateReadouts();
  render();

  // Pause once figure has fully walked off canvas (~1.5 m past edge)
  if (Math.abs(x) > 11.5) {
    triggerBoundary();
    return;
  }

  rafId = requestAnimationFrame(physicsStep);
}

// =============================================================
// Start / Pause
// =============================================================
function startSimulation() {
  running = true;
  lastTimestamp = null;
  btnStartPause.textContent = 'Pause';
  clearBoundary();
  rafId = requestAnimationFrame(physicsStep);
}

function pauseSimulation() {
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  btnStartPause.textContent = 'Start';
}

// =============================================================
// Canvas drag — click and drag the stick figure
// =============================================================
function getCanvasCoords(e) {
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    cx: (e.clientX - rect.left) * scaleX,
    cy: (e.clientY - rect.top)  * scaleY
  };
}

function isOverFigure(cx, cy) {
  const figPx = mToPixel(x);
  return Math.abs(cx - figPx) < 22 && cy > (FIGURE_Y - 88) && cy < (FIGURE_Y + 26);
}

canvas.addEventListener('mousedown', e => {
  const { cx, cy } = getCanvasCoords(e);
  if (isOverFigure(cx, cy)) {
    isDragging = true;
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
  }
});

window.addEventListener('mousemove', e => {
  const { cx, cy } = getCanvasCoords(e);

  if (!isDragging) {
    // Hover cursor hint
    if (e.target === canvas) {
      canvas.style.cursor = isOverFigure(cx, cy) ? 'grab' : 'default';
    }
    return;
  }

  // Clamp x to number-line range while dragging
  x = Math.max(X_MIN, Math.min(X_MAX, pixelToM(cx)));
  clearBoundary();
  updateReadouts();
  render();
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    canvas.style.cursor = 'default';
  }
});

// =============================================================
// Slider events
// =============================================================

sliderX.addEventListener('input', () => {
  x = parseFloat(sliderX.value);
  valX.textContent  = fmt(x, 1, 'm');
  readX.textContent = fmt(x, 2, 'm');
  clearBoundary();
  render();
});

sliderV.addEventListener('input', () => {
  v = parseFloat(sliderV.value);
  valV.textContent  = fmt(v, 1, 'm/s');
  readV.textContent = fmt(v, 2, 'm/s');
  render();
});

sliderA.addEventListener('input', () => {
  a = parseFloat(sliderA.value);
  valA.textContent  = fmt(a, 1, 'm/s²');
  readA.textContent = fmt(a, 1, 'm/s²');
  render();
});

// =============================================================
// Buttons
// =============================================================
btnStartPause.addEventListener('click', () => {
  running ? pauseSimulation() : startSimulation();
});

btnReset.addEventListener('click', () => {
  pauseSimulation();
  x = 0; v = 0; a = 0;
  isDragging = false;
  clearBoundary();
  updateReadouts();
  render();
});

// =============================================================
// Init
// =============================================================
updateReadouts();
render();
</script>
</body>
</html>
