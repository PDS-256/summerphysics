<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1D Motion Explorer</title>
  <style>
    /* --- Base / Reset --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1e2e;
      --surface:   #232840;
      --border:    #323755;
      --text:      #e8eaf0;
      --text-dim:  #8a90a8;
      --color-x:   #5b9cf6;   /* blue  — position */
      --color-v:   #4ec994;   /* green — velocity  */
      --color-a:   #f4874b;   /* orange— accel     */
      --radius:    10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
      gap: 20px;
    }

    /* --- Title --- */
    h1 {
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    h1 span {
      color: var(--color-x);
    }

    /* --- Main card --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      width: 100%;
      max-width: 720px;
    }

    /* --- Canvas --- */
    #simCanvas {
      display: block;
      width: 100%;
      border-radius: 6px;
      background: #111520;
      cursor: default;
    }

    /* --- Readout panel --- */
    .readout {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 14px;
    }
    .readout-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .readout-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }
    .readout-value {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      text-align: center;
    }
    .readout-item.x .readout-value { color: var(--color-x); }
    .readout-item.v .readout-value { color: var(--color-v); }
    .readout-item.a .readout-value { color: var(--color-a); }

    /* --- Boundary message --- */
    #boundaryMsg {
      display: none;
      text-align: center;
      margin-top: 10px;
      padding: 7px 14px;
      border-radius: 6px;
      background: rgba(244, 135, 75, 0.18);
      border: 1px solid rgba(244, 135, 75, 0.45);
      color: var(--color-a);
      font-size: 0.88rem;
      font-weight: 500;
    }
    #boundaryMsg.visible { display: block; }

    /* --- Slider panel --- */
    .sliders {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }
    .slider-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      align-items: center;
      gap: 12px;
    }
    .slider-label {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-align: right;
    }
    .slider-label em {
      font-style: italic;
      font-weight: 700;
      font-size: 1rem;
    }
    .slider-label em.x { color: var(--color-x); }
    .slider-label em.v { color: var(--color-v); }
    .slider-label em.a { color: var(--color-a); }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      background: var(--border);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      cursor: pointer;
    }
    #sliderX::-webkit-slider-thumb { background: var(--color-x); }
    #sliderV::-webkit-slider-thumb { background: var(--color-v); }
    #sliderA::-webkit-slider-thumb { background: var(--color-a); }
    #sliderX::-moz-range-thumb { background: var(--color-x); width:14px; height:14px; border-radius:50%; border:2px solid var(--surface); cursor:pointer; }
    #sliderV::-moz-range-thumb { background: var(--color-v); width:14px; height:14px; border-radius:50%; border:2px solid var(--surface); cursor:pointer; }
    #sliderA::-moz-range-thumb { background: var(--color-a); width:14px; height:14px; border-radius:50%; border:2px solid var(--surface); cursor:pointer; }

    .slider-val {
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }
    .slider-val.x { color: var(--color-x); }
    .slider-val.v { color: var(--color-v); }
    .slider-val.a { color: var(--color-a); }

    /* --- Controls --- */
    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 4px;
    }
    button {
      padding: 9px 32px;
      border-radius: 7px;
      border: 1.5px solid;
      font-size: 0.93rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #btnStartPause {
      background: var(--color-v);
      border-color: var(--color-v);
      color: #111520;
    }
    #btnStartPause:hover {
      background: #3db87e;
    }
    #btnReset {
      background: transparent;
      border-color: var(--border);
      color: var(--text-dim);
    }
    #btnReset:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }
  </style>
</head>
<body>

  <h1>1D Motion <span>Explorer</span></h1>

  <!-- Simulation canvas -->
  <div class="card">
    <canvas id="simCanvas" width="672" height="200"></canvas>
    <div id="boundaryMsg">Object left the frame — press Reset</div>

    <!-- Numerical readout -->
    <div class="readout">
      <div class="readout-item x">
        <span class="readout-label">Position</span>
        <span class="readout-value" id="readX">0.00 m</span>
      </div>
      <div class="readout-item v">
        <span class="readout-label">Velocity</span>
        <span class="readout-value" id="readV">0.00 m/s</span>
      </div>
      <div class="readout-item a">
        <span class="readout-label">Acceleration</span>
        <span class="readout-value" id="readA">0.00 m/s²</span>
      </div>
    </div>
  </div>

  <!-- Sliders -->
  <div class="card sliders">
    <div class="slider-row">
      <span class="slider-label"><em class="x">x</em> (m)</span>
      <input type="range" id="sliderX" min="-10" max="10" step="0.5" value="0">
      <span class="slider-val x" id="valX">0.0 m</span>
    </div>
    <div class="slider-row">
      <span class="slider-label"><em class="v">v</em> (m/s)</span>
      <input type="range" id="sliderV" min="-2" max="2" step="0.1" value="0">
      <span class="slider-val v" id="valV">0.0 m/s</span>
    </div>
    <div class="slider-row">
      <span class="slider-label"><em class="a">a</em> (m/s²)</span>
      <input type="range" id="sliderA" min="-2" max="2" step="1" value="0">
      <span class="slider-val a" id="valA">0 m/s²</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="card controls">
    <button id="btnStartPause">Start</button>
    <button id="btnReset">Reset</button>
  </div>

<script>
// =============================================================
// State
// =============================================================
let x = 0;       // position (m)
let v = 0;       // velocity (m/s)
let a = 0;       // acceleration (m/s²)

let running       = false;
let rafId         = null;
let lastTimestamp = null;

// Flash effect on v-arrow when x is manually dragged
let vFlashFrames = 0;
const V_FLASH_DURATION = 18; // frames

// =============================================================
// DOM refs
// =============================================================
const canvas       = document.getElementById('simCanvas');
const ctx          = canvas.getContext('2d');
const sliderX      = document.getElementById('sliderX');
const sliderV      = document.getElementById('sliderV');
const sliderA      = document.getElementById('sliderA');
const valX         = document.getElementById('valX');
const valV         = document.getElementById('valV');
const valA         = document.getElementById('valA');
const readX        = document.getElementById('readX');
const readV        = document.getElementById('readV');
const readA        = document.getElementById('readA');
const btnStartPause = document.getElementById('btnStartPause');
const btnReset     = document.getElementById('btnReset');
const boundaryMsg  = document.getElementById('boundaryMsg');

// =============================================================
// Canvas geometry helpers
// =============================================================
// The logical number line runs from -10 to +10 m.
// We map it to canvas pixel x-coordinates.
const X_MIN = -10, X_MAX = 10;  // m

function mToPixel(meterVal) {
  const cw = canvas.width;
  const pad = 40; // px margin on each side for labels
  return pad + (meterVal - X_MIN) / (X_MAX - X_MIN) * (cw - 2 * pad);
}

const FIGURE_Y   = 118;  // baseline of figure on canvas (px)
const V_ARROW_Y  = FIGURE_Y - 42; // vertical center for velocity arrow
const A_ARROW_Y  = FIGURE_Y - 68; // vertical center for accel arrow

// Scale: 2 m/s should fill ~1/4 of usable canvas width
function speedToPixels(speed) {
  const usable = canvas.width - 80;
  return (Math.abs(speed) / 2) * (usable / 4);
}

// =============================================================
// Colors
// =============================================================
const COLOR_X   = '#5b9cf6';
const COLOR_V   = '#4ec994';
const COLOR_A   = '#f4874b';
const COLOR_DIM = '#8a90a8';
const COLOR_BG  = '#111520';
const COLOR_LINE = '#2c3252';
const COLOR_ZERO = '#e8eaf0';

// =============================================================
// Render canvas
// =============================================================
function render() {
  const cw = canvas.width;
  const ch = canvas.height;

  // Background
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, cw, ch);

  // --- Number line ---
  const lineY = FIGURE_Y + 6;
  ctx.strokeStyle = COLOR_LINE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mToPixel(X_MIN), lineY);
  ctx.lineTo(mToPixel(X_MAX), lineY);
  ctx.stroke();

  // Tick marks and labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let m = X_MIN; m <= X_MAX; m++) {
    const px = mToPixel(m);
    const isMajor = (m % 5 === 0);
    const isZero  = (m === 0);

    ctx.strokeStyle = isZero ? COLOR_ZERO : (isMajor ? '#4a5275' : COLOR_LINE);
    ctx.lineWidth   = isZero ? 2.5 : (isMajor ? 1.5 : 1);
    const tickH = isZero ? 12 : (isMajor ? 9 : 5);
    ctx.beginPath();
    ctx.moveTo(px, lineY - tickH);
    ctx.lineTo(px, lineY + tickH);
    ctx.stroke();

    if (isMajor || isZero) {
      ctx.fillStyle = isZero ? COLOR_ZERO : COLOR_DIM;
      ctx.font = isZero ? 'bold 11px Segoe UI, system-ui, sans-serif'
                        : '10px Segoe UI, system-ui, sans-serif';
      ctx.fillText(String(m), px, lineY + tickH + 3);
    }
  }

  // "m" unit label at right end
  ctx.fillStyle = COLOR_DIM;
  ctx.font = '10px Segoe UI, system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('m', mToPixel(X_MAX) + 4, lineY - 4);

  // --- Figure position ---
  const figPx = mToPixel(x);

  // --- Velocity arrow ---
  if (Math.abs(v) > 0.001) {
    const len = speedToPixels(v);
    const dir = v > 0 ? 1 : -1;
    const ax0 = figPx;
    const ax1 = figPx + dir * len;

    // Flash color if x was manually dragged
    let vColor = COLOR_V;
    if (vFlashFrames > 0) {
      const t = vFlashFrames / V_FLASH_DURATION;
      vColor = lerpColor(COLOR_V, '#ffffff', t * 0.7);
    }

    drawArrow(ctx, ax0, V_ARROW_Y, ax1, V_ARROW_Y, vColor, 2.5);

    // Label
    ctx.fillStyle = vColor;
    ctx.font = 'italic bold 12px Segoe UI, system-ui, sans-serif';
    ctx.textAlign = dir > 0 ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    const labelX = ax1 + dir * 6;
    ctx.fillText(`v = ${v >= 0 ? '+' : ''}${v.toFixed(1)}`, labelX, V_ARROW_Y);
  }

  // --- Acceleration arrow ---
  if (Math.abs(a) > 0.001) {
    const len = speedToPixels(a);  // same scale; a ∈ {±1, ±2}
    const dir = a > 0 ? 1 : -1;
    const ax0 = figPx;
    const ax1 = figPx + dir * len;

    drawArrow(ctx, ax0, A_ARROW_Y, ax1, A_ARROW_Y, COLOR_A, 2.5);

    ctx.fillStyle = COLOR_A;
    ctx.font = 'italic bold 12px Segoe UI, system-ui, sans-serif';
    ctx.textAlign = dir > 0 ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    const labelX = ax1 + dir * 6;
    ctx.fillText(`a = ${a >= 0 ? '+' : ''}${a.toFixed(0)}`, labelX, A_ARROW_Y);
  }

  // --- XKCD-style stick figure ---
  drawFigure(ctx, figPx, FIGURE_Y);
}

// =============================================================
// SVG-style arrow on canvas
// =============================================================
function drawArrow(ctx, x0, y0, x1, y1, color, lineWidth) {
  const headLen = 9;
  const headAngle = Math.PI / 6;
  const angle = Math.atan2(y1 - y0, x1 - x0);

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = lineWidth;
  ctx.lineCap     = 'round';

  // Shaft
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();

  // Arrowhead (filled triangle)
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - headLen * Math.cos(angle - headAngle),
             y1 - headLen * Math.sin(angle - headAngle));
  ctx.lineTo(x1 - headLen * Math.cos(angle + headAngle),
             y1 - headLen * Math.sin(angle + headAngle));
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// =============================================================
// XKCD-style stick figure (simple inline SVG drawn on canvas)
// =============================================================
function drawFigure(ctx, cx, baseY) {
  const headR   = 9;
  const torsoH  = 22;
  const legLen  = 18;
  const armLen  = 13;
  const headTop = baseY - torsoH - legLen - headR * 2 - 2;
  const headCY  = headTop + headR;
  const shoulderY = headCY + headR + 2;
  const hipY    = shoulderY + torsoH;

  ctx.save();
  ctx.strokeStyle = '#d8dce8';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  // Head
  ctx.beginPath();
  ctx.arc(cx, headCY, headR, 0, Math.PI * 2);
  ctx.stroke();

  // Torso
  ctx.beginPath();
  ctx.moveTo(cx, shoulderY);
  ctx.lineTo(cx, hipY);
  ctx.stroke();

  // Arms (slightly bent outward)
  ctx.beginPath();
  ctx.moveTo(cx - armLen, shoulderY + 8);
  ctx.lineTo(cx, shoulderY + 4);
  ctx.lineTo(cx + armLen, shoulderY + 8);
  ctx.stroke();

  // Legs (slightly apart)
  const footY = hipY + legLen;
  ctx.beginPath();
  ctx.moveTo(cx, hipY);
  ctx.lineTo(cx - 8, footY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, hipY);
  ctx.lineTo(cx + 8, footY);
  ctx.stroke();

  ctx.restore();
}

// =============================================================
// Color lerp for flash effect
// =============================================================
function lerpColor(hex0, hex1, t) {
  const parse = h => [
    parseInt(h.slice(1, 3), 16),
    parseInt(h.slice(3, 5), 16),
    parseInt(h.slice(5, 7), 16)
  ];
  const [r0, g0, b0] = parse(hex0);
  const [r1, g1, b1] = parse(hex1);
  const r = Math.round(r0 + (r1 - r0) * t);
  const g = Math.round(g0 + (g1 - g0) * t);
  const b = Math.round(b0 + (b1 - b0) * t);
  return `rgb(${r},${g},${b})`;
}

// =============================================================
// Update readout labels and slider display values
// =============================================================
function updateReadouts() {
  readX.textContent = `${x >= 0 ? '+' : ''}${x.toFixed(2)} m`;
  readV.textContent = `${v >= 0 ? '+' : ''}${v.toFixed(2)} m/s`;
  readA.textContent = `${a >= 0 ? '+' : ''}${a.toFixed(0)} m/s²`;

  valX.textContent = `${x >= 0 ? '+' : ''}${x.toFixed(1)} m`;
  valV.textContent = `${v >= 0 ? '+' : ''}${v.toFixed(1)} m/s`;
  valA.textContent = `${a >= 0 ? '+' : ''}${a.toFixed(0)} m/s²`;

  // Keep sliders in sync with physics state
  sliderX.value = x;
  sliderV.value = v;
  sliderA.value = a;
}

// =============================================================
// Physics update (called each animation frame)
// =============================================================
function physicsStep(timestamp) {
  if (lastTimestamp === null) lastTimestamp = timestamp;
  const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // cap at 50 ms
  lastTimestamp = timestamp;

  // Read acceleration live from slider (allows mid-sim adjustments)
  a = parseFloat(sliderA.value);

  v += a * dt;
  v = Math.max(-20, Math.min(20, v)); // soft clamp to prevent runaway
  x += v * dt;

  // Decay flash
  if (vFlashFrames > 0) vFlashFrames--;

  // Boundary check
  if (Math.abs(x) >= 10) {
    x = Math.sign(x) * 10;
    pauseSimulation();
    boundaryMsg.classList.add('visible');
    updateReadouts();
    render();
    return;
  }

  updateReadouts();
  render();
  rafId = requestAnimationFrame(physicsStep);
}

// =============================================================
// Start / Pause
// =============================================================
function startSimulation() {
  running = true;
  lastTimestamp = null;
  btnStartPause.textContent = 'Pause';
  boundaryMsg.classList.remove('visible');
  rafId = requestAnimationFrame(physicsStep);
}

function pauseSimulation() {
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  btnStartPause.textContent = 'Start';
}

// =============================================================
// Slider setup
// =============================================================

// Position slider — manual override; flash v-arrow
sliderX.addEventListener('input', () => {
  x = parseFloat(sliderX.value);
  valX.textContent = `${x >= 0 ? '+' : ''}${x.toFixed(1)} m`;
  readX.textContent = `${x >= 0 ? '+' : ''}${x.toFixed(2)} m`;
  vFlashFrames = V_FLASH_DURATION; // trigger flash
  boundaryMsg.classList.remove('visible');
  render();
});

// Velocity slider — always live
sliderV.addEventListener('input', () => {
  v = parseFloat(sliderV.value);
  valV.textContent = `${v >= 0 ? '+' : ''}${v.toFixed(1)} m/s`;
  readV.textContent = `${v >= 0 ? '+' : ''}${v.toFixed(2)} m/s`;
  render();
});

// Acceleration slider — always live
sliderA.addEventListener('input', () => {
  a = parseFloat(sliderA.value);
  valA.textContent = `${a >= 0 ? '+' : ''}${a.toFixed(0)} m/s²`;
  readA.textContent = `${a >= 0 ? '+' : ''}${a.toFixed(0)} m/s²`;
  if (!running) render();
});

// =============================================================
// Button handlers
// =============================================================
btnStartPause.addEventListener('click', () => {
  if (running) {
    pauseSimulation();
  } else {
    startSimulation();
  }
});

btnReset.addEventListener('click', () => {
  pauseSimulation();
  x = 0; v = 0; a = 0;
  vFlashFrames = 0;
  boundaryMsg.classList.remove('visible');
  updateReadouts();
  render();
});

// =============================================================
// Initial render
// =============================================================
updateReadouts();
render();
</script>
</body>
</html>
